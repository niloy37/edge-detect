# Face detection. The first genuinely custom model in this repo -- COCO-80 is stock
# weights and exists as a control.
#
# Deliberately face DETECTION only: where faces are, not whose they are. The demo
# built on it blurs faces rather than identifying them, and no identity or embedding
# model ships here.
id: face-n
name: Faces (custom)
domain: Faces
order: 1
description: >-
  YOLO11n fine-tuned on Open Images "Human face". Powers the privacy-blur demo,
  which finds and obscures faces entirely on-device -- the frames never leave the
  browser, which is the strongest possible version of this project's argument.
weights: yolo11n.pt
imgsz: 640
opset: 17

data:
  # Open Images rather than WIDER FACE, which is the usual choice here. WIDER FACE is
  # CC-BY-NC-ND and a trained model is arguably a derivative work; these weights get
  # published, so that licence is the wrong foundation. Open Images annotations are
  # CC-BY-4.0 and its images CC-BY-2.0.
  source: openimages
  classes:
    - id: /m/0dzct
      name: face
  # Separate Open Images splits, so train and val share no images by construction.
  train_split: test
  val_split: validation
  max_train: 8000
  max_val: 1500

train:
  epochs: 40
  batch: 32
  patience: 10

calibration:
  # Calibrate on this model's own val split, never on COCO: activation ranges for
  # close-up faces look nothing like ranges for buses and giraffes, and calibrating
  # on the wrong domain is what produces a model that benchmarks fast and detects
  # poorly.
  images_dir: datasets/face-n/images/val
  num_images: 128
  method: percentile
  percentile: 99.999

eval:
  data: datasets/face-n/dataset.yaml
  note: >-
    Open Images "Human face", 1500-image validation split held out from training.

dataset:
  name: Open Images V5/V7 — "Human face"
  url: https://storage.googleapis.com/openimages/web/index.html
  license: "Annotations CC BY 4.0 (Google LLC); images CC BY 2.0 (Flickr contributors)."

sample:
  video: null
  image: /samples/face-n.jpg
  credit: Open Images validation image (CC BY 2.0)
