# General-purpose baseline. No fine-tuning: these are the stock COCO weights.
# It ships as the default model so that a visitor pointing a webcam at their desk
# always sees detections, regardless of which custom domain they picked.
id: coco80-n
name: COCO-80 general
domain: General objects
description: >-
  Stock YOLO11n trained on COCO 2017. The control condition for every benchmark
  on this site: any latency or accuracy claim about a custom model is only
  meaningful next to this one.
weights: yolo11n.pt
imgsz: 640
opset: 17
train: null
calibration:
  # 128-image COCO subset, auto-downloaded by Ultralytics. Static INT8 PTQ needs
  # real activations; calibrating on synthetic noise is how you get a model that
  # benchmarks fast and detects nothing.
  dataset: coco128
  num_images: 96
  # Measured on this model: MinMax 0.3980, Entropy 0.3980, Percentile 0.4094
  # mAP50-95. MinMax stretches activation scales to fit outliers; clipping the tail
  # at 99.999 keeps resolution where the values actually live.
  method: percentile
  percentile: 99.999
eval:
  # coco128 is a 128-image subset, not COCO val2017. Stated here and rendered on the
  # site verbatim: "mAP on COCO" and "mAP on 128 COCO images" are different claims and
  # only the second one is true. Point `data` at coco.yaml for the real thing (~20GB).
  data: coco128.yaml
  note: >-
    128-image COCO subset (coco128), evaluated on the train split it ships with.
    Indicative only -- useful for measuring the FP32 to INT8 delta on identical
    images, not for comparing against published COCO leaderboard numbers.
dataset:
  name: COCO 2017
  url: https://cocodataset.org/
  license: "Images: CC BY 4.0 / Flickr terms. Weights: AGPL-3.0 (Ultralytics)."
sample:
  video: null
  # Shown when the visitor has no camera or denies access, so the demo is never dead.
  image: /samples/coco80-n.jpg
  credit: Ultralytics test image (bus.jpg)
